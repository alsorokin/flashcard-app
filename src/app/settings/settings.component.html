<div class="settings-wrapper" [class]="{'collapsed': isCollapsed}">
  <div class="button-wrapper">
    <button class="settings-button" type="button" (click)="toggleCollapse()">⚙</button>
  </div>
  <div class="settings" [class]="{'collapsed': isCollapsed}">
    <label class="language-pair" htmlFor="language-pair">
      <span>Пара:</span>
      <select id="language-pair" [(ngModel)]="languagePairCode" (change)="changeLanguagePair($event)">
        @for (pair of languagePairs; track pair.code) {
        <option [ngValue]="pair.code">{{ pair.label }}</option>
        }
      </select>
    </label>
    <hr>
    <label class="settings-toggle" htmlFor="flipped-mode">
      <input type="checkbox" id="flipped-mode" (change)="toggleFlippedMode($event)" [checked]="flippedModeEnabled" />
      Перевёртыши 🗘
    </label>
    <label class="settings-toggle" htmlFor="auto-play">
      <input type="checkbox" id="auto-play" (change)="toggleAutoPlay($event)" [checked]="autoPlayEnabled" /> Звук 🔊
    </label>
    <hr>
    <div class="collection-links">
      <div class="collection-actions">
        <a href="#" (click)="toggleAll(true); $event.preventDefault()">Выбрать всё</a>
        <a href="#" (click)="toggleAll(false); $event.preventDefault()">Сбросить всё</a>
      </div>
      <div class="selection-summary">
        {{ selectedWordsCount }} / {{ totalWordsCount }}
      </div>
    </div>
    <mat-form-field class="collections-field">
      <mat-label>Наборы</mat-label>
      <mat-select [ngModel]="selectedCollectionNames" (ngModelChange)="updateSelectedCollections($event)" multiple>
        <mat-select-trigger>
          Выбрано: {{ selectedCollectionNames.length }}
        </mat-select-trigger>
        @for (collection of wordCollections; track collection.name) {
          <mat-option [value]="collection.name">{{ collection.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <hr>
    <a href="#/edit">Редактор слов</a>
  </div>
</div>
